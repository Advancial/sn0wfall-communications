<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>❄️ Snowfall Secrecy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">
</head>
<body>

<div id="snow"></div>

<div id="callBanner" class="call-banner" style="display: none;">
    <p><strong id="callerName">User</strong> is calling...</p>
    <div class="banner-buttons">
        <button id="acceptCallBtn">Accept</button>
        <button id="declineCallBtn" class="decline">Decline</button>
    </div>
</div>

<div class="container">
    <div id="authBox">
        <h1>❄️ Snowfall Secrecy</h1>
        <input id="authUsername" placeholder="Username">
        <input id="authPassword" type="password" placeholder="Password">
        <div class="auth-buttons">
            <button id="loginBtn">Log In</button>
            <button id="registerBtn">Register</button>
        </div>
    </div>

    <div id="chatBox" style="display: none;">
<header>
    <h1 id="chatTitle">❄️ Global Chat</h1>
    <div class="header-actions">
        <button id="dmBtn">💬 DM</button>
        <button id="callBtn">📞 Call</button>
        <button id="muteBtn" style="display: none;">🎙️ Mute</button>
        <button id="hangupBtn" style="display: none; background: #ff8c8c;">❌ End</button>
    </div>
</header>

        <main id="chat"></main>

        <footer>
            <input id="mediaInput" type="file" accept="image/*,video/*">
            <input id="messageInput" placeholder="Message...">
            <button id="sendBtn">➤</button>
        </footer>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
